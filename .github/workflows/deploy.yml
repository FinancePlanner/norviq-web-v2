# Builds and deploys the Worker. Called by ci.yml for staging after a green
# push to main; dispatch it by hand for production:
#
#   gh workflow run deploy.yml -f environment=production
#
# Needs one repository secret, CLOUDFLARE_API_TOKEN. The Worker's own secrets
# (SESSION_SECRET, PUBLIC_API_TOKEN, ...) live on Cloudflare and survive
# deploys; see docs/DEPLOY.md.
name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      environment:
        description: Worker to deploy
        type: choice
        options: [production, staging]
        default: production

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: wrangler deploy
        run: |
          if [ "${{ inputs.environment }}" = production ]; then
            bunx wrangler deploy --message "${GITHUB_SHA::12}"
          else
            bunx wrangler deploy --env staging --message "${GITHUB_SHA::12}"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
