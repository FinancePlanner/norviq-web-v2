# Checks every PR and every push to main. A green push to main deploys the
# staging Worker; production is a manual dispatch of deploy.yml.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run lint
      # 3D Vig motion (BRD-001): the fixtures must be regenerated after a design/vig-motion.json
      # change. norviq-ios CI compares its copies against this repo's main.
      - run: ./scripts/check-vig-motion-drift.sh
      - run: ./scripts/check-three-imports.sh
      # Only the server project: the client and storybook projects need a
      # browser.
      - run: bunx vitest run --project server
      - run: bun run build
      # Route budgets must not grow; only the lazy total may, by an explicit --update-lazy.
      - run: bun scripts/size-budget.mjs
      # After build: the generated types include the built worker's module
      # (GlobalProps.mainModule), so the check depends on the build output.
      - run: bun run types:check

  deploy-staging:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
    secrets: inherit
