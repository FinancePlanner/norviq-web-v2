<!doctype html>
<html lang="%lang%" data-theme="system" data-brand="vigil">
	<head>
		<meta charset="utf-8" />
		<script>
			// Blocking theme bootstrap (norviq-web static/theme-init.js): set the
			// appearance and sidebar state before CSS paints, so there is no flash.
			!(function () {
				var root = document.documentElement;
				try {
					var m = localStorage.getItem('app_appearance') || 'system';
					root.dataset.theme = m;
					var dark =
						m === 'dark' ||
						(m === 'system' &&
							window.matchMedia &&
							window.matchMedia('(prefers-color-scheme: dark)').matches);
					root.classList.toggle('dark', dark);
					if (localStorage.getItem('app_sidebar') === 'collapsed')
						root.dataset.sidebar = 'collapsed';
				} catch (e) {}
			})();
		</script>
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#f3f8fa" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#050809" media="(prefers-color-scheme: dark)" />
		<link rel="manifest" href="/static/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="/static/apple-touch-icon.png" />
		<link rel="icon" href="/static/favicon.png" type="image/png" />
		<link
			rel="preload"
			href="/static/fonts/geist-sans-latin-400-normal.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<link
			rel="preload"
			href="/static/fonts/geist-sans-latin-600-normal.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<a class="skip-link" href="#main-content">Skip to content</a>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
